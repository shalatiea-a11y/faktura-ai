<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Fakturaskanning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0A0C10; --surface: #13161D; --surface-2: #1B2029; --line: #2B3140;
  --paper: #F2EFE8; --paper-dim: #A3A8B4; --paper-faint: #6B707C;
  --gold: #D9A94E; --gold-2: #9C7627; --gold-glow: rgba(217,169,78,0.30);
  --success: #3FA66B; --error: #F0A0AC;
  --font-display: 'Oswald', sans-serif; --font-body: 'Manrope', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--font-body); min-height: 100vh; }
.wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
h1 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--paper-faint); font-size: 13px; margin-bottom: 28px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; margin-bottom: 22px; }
.card h2 { font-family: var(--font-display); font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); margin: 0 0 16px; }
label { display: block; font-size: 11.5px; font-weight: 700; color: var(--paper-dim); text-transform: uppercase; letter-spacing: 0.05em; margin: 14px 0 6px; }
label:first-child { margin-top: 0; }
input[type=text], input[type=date], input[type=number] {
  width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--paper); font-family: inherit; font-size: 15px;
}
input:focus { outline: 2px solid var(--gold-2); outline-offset: -1px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: var(--ink);
  border: none; border-radius: 8px; padding: 12px 20px; font-weight: 800; font-size: 14px;
  cursor: pointer; font-family: inherit;
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--paper); }
.btn.block { width: 100%; }
.btn.small { padding: 8px 14px; font-size: 12.5px; }
.btn.danger { background: transparent; border: 1px solid rgba(240,160,172,0.4); color: var(--error); }
.file-drop {
  border: 2px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center;
  color: var(--paper-faint); font-size: 14px; cursor: pointer;
}
.file-drop.has-file { border-color: var(--gold); color: var(--paper); }
#file-input { display: none; }
.msg { font-size: 13px; margin-top: 12px; }
.msg.error { color: var(--error); }
.msg.success { color: var(--success); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--paper-faint); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
td.num { text-align: right; font-family: var(--font-display); }
.empty { color: var(--paper-faint); font-size: 14px; padding: 20px 0; text-align: center; }
.key-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--paper); font-size: 15px; margin-bottom: 12px; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.3); border-top-color: var(--ink); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fakturaskanning</h1>
  <div class="sub">Ladda upp en leverantörsfaktura, låt AI läsa ut uppgifterna, kontrollera och spara.</div>

  <div class="card key-box" id="key-box" style="display:none;">
    <label>Ange din nyckel</label>
    <input type="text" id="key-input" placeholder="nyckel...">
    <button class="btn block" id="save-key">Logga in</button>
  </div>

  <div id="app" style="display:none;">
    <div class="card">
      <h2>1. Ladda upp faktura</h2>
      <div class="file-drop" id="file-drop">
        <div id="file-drop-label">Klicka för att välja en bild eller PDF av fakturan</div>
      </div>
      <input type="file" id="file-input" accept="image/*,application/pdf">
      <button class="btn block" id="scan-btn" style="margin-top:14px;" disabled>Läs faktura med AI</button>
      <div id="scan-msg" class="msg"></div>
    </div>

    <div class="card" id="review-card" style="display:none;">
      <h2>2. Kontrollera uppgifter</h2>
      <label>Leverantör</label>
      <input type="text" id="f-leverantor">
      <div class="row2">
        <div><label>Fakturanummer</label><input type="text" id="f-fakturanummer"></div>
        <div><label>OCR/referens</label><input type="text" id="f-ocr"></div>
      </div>
      <div class="row2">
        <div><label>Fakturadatum</label><input type="date" id="f-fakturadatum"></div>
        <div><label>Förfallodatum</label><input type="date" id="f-forfallodatum"></div>
      </div>
      <div class="row2">
        <div><label>Belopp exkl. moms</label><input type="number" step="0.01" id="f-belopp"></div>
        <div><label>Moms</label><input type="number" step="0.01" id="f-moms"></div>
      </div>
      <label>Totalbelopp</label>
      <input type="number" step="0.01" id="f-total">
      <button class="btn block" id="save-invoice-btn" style="margin-top:16px;">Spara faktura</button>
      <div id="save-msg" class="msg"></div>
    </div>

    <div class="card">
      <h2>Sparade fakturor</h2>
      <div id="invoices-list"><div class="empty">Laddar…</div></div>
      <button class="btn ghost block" id="export-csv-btn" style="margin-top:16px;">Exportera CSV</button>
    </div>
  </div>
</div>

<script>
let clientKey = '';
let invoices = [];
let currentFile = null;

function getKey() {
  const url = new URL(window.location.href);
  const fromUrl = url.searchParams.get('key');
  if (fromUrl) { localStorage.setItem('faktura_client_key', fromUrl); return fromUrl; }
  return localStorage.getItem('faktura_client_key') || '';
}

function fmt(n) { return (Math.round((n || 0) * 100) / 100).toFixed(2) + ' kr'; }

async function init() {
  clientKey = getKey();
  if (!clientKey) {
    document.getElementById('key-box').style.display = 'block';
    return;
  }
  document.getElementById('app').style.display = 'block';
  await loadInvoices();
}

document.getElementById('save-key').addEventListener('click', () => {
  const v = document.getElementById('key-input').value.trim();
  if (v) { localStorage.setItem('faktura_client_key', v); location.reload(); }
});

document.getElementById('file-drop').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  currentFile = file;
  document.getElementById('file-drop').classList.add('has-file');
  document.getElementById('file-drop-label').textContent = `✓ ${file.name}`;
  document.getElementById('scan-btn').disabled = false;
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('scan-btn').addEventListener('click', async () => {
  if (!currentFile) return;
  const btn = document.getElementById('scan-btn');
  const msg = document.getElementById('scan-msg');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Läser faktura…';
  msg.textContent = '';
  try {
    const data = await fileToBase64(currentFile);
    const res = await fetch('/api/extract', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: clientKey, media_type: currentFile.type, data }),
    });
    const result = await res.json();
    if (!res.ok) {
      if (result.error === 'ai_not_configured') {
        msg.innerHTML = '<span class="msg error">AI-nyckeln är inte inställd än på servern.</span>';
      } else {
        msg.innerHTML = `<span class="msg error">Kunde inte läsa fakturan (${result.error || 'okänt fel'}). Försök igen eller fyll i manuellt.</span>`;
      }
      return;
    }
    const f = result.fields || {};
    document.getElementById('f-leverantor').value = f.leverantor || '';
    document.getElementById('f-fakturanummer').value = f.fakturanummer || '';
    document.getElementById('f-ocr').value = f.ocr || '';
    document.getElementById('f-fakturadatum').value = f.fakturadatum || '';
    document.getElementById('f-forfallodatum').value = f.forfallodatum || '';
    document.getElementById('f-belopp').value = f.belopp_exkl_moms || '';
    document.getElementById('f-moms').value = f.moms || '';
    document.getElementById('f-total').value = f.totalbelopp || '';
    document.getElementById('review-card').style.display = 'block';
    document.getElementById('review-card').scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    msg.innerHTML = '<span class="msg error">Nätverksfel, försök igen.</span>';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Läs faktura med AI';
  }
});

document.getElementById('save-invoice-btn').addEventListener('click', async () => {
  const fields = {
    leverantor: document.getElementById('f-leverantor').value,
    fakturanummer: document.getElementById('f-fakturanummer').value,
    ocr: document.getElementById('f-ocr').value,
    fakturadatum: document.getElementById('f-fakturadatum').value,
    forfallodatum: document.getElementById('f-forfallodatum').value,
    belopp_exkl_moms: document.getElementById('f-belopp').value,
    moms: document.getElementById('f-moms').value,
    totalbelopp: document.getElementById('f-total').value,
  };
  const msg = document.getElementById('save-msg');
  try {
    const res = await fetch('/api/invoices', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: clientKey, fields }),
    });
    if (!res.ok) throw new Error('failed');
    msg.innerHTML = '<span class="msg success">✅ Sparad!</span>';
    document.getElementById('review-card').style.display = 'none';
    document.getElementById('file-drop').classList.remove('has-file');
    document.getElementById('file-drop-label').textContent = 'Klicka för att välja en bild eller PDF av fakturan';
    document.getElementById('scan-btn').disabled = true;
    currentFile = null;
    document.getElementById('file-input').value = '';
    await loadInvoices();
  } catch (e) {
    msg.innerHTML = '<span class="msg error">Kunde inte spara, försök igen.</span>';
  }
});

async function loadInvoices() {
  const list = document.getElementById('invoices-list');
  try {
    const res = await fetch(`/api/invoices?key=${encodeURIComponent(clientKey)}`);
    const data = await res.json();
    invoices = data.invoices || [];
  } catch (e) {
    invoices = [];
  }
  renderInvoices();
}

function renderInvoices() {
  const list = document.getElementById('invoices-list');
  if (!invoices.length) {
    list.innerHTML = '<div class="empty">Inga fakturor sparade än.</div>';
    return;
  }
  list.innerHTML = `
    <table>
      <thead><tr><th>Leverantör</th><th>Fakturanr</th><th>Förfaller</th><th class="num">Totalt</th><th></th></tr></thead>
      <tbody>
        ${invoices.map((inv) => `
          <tr>
            <td>${inv.leverantor}</td>
            <td>${inv.fakturanummer}</td>
            <td>${inv.forfallodatum}</td>
            <td class="num">${fmt(inv.totalbelopp)}</td>
            <td><button class="btn danger small" data-id="${inv.id}">Ta bort</button></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
  list.querySelectorAll('[data-id]').forEach((btn) => btn.addEventListener('click', async () => {
    await fetch('/api/invoices', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: clientKey, action: 'delete', id: btn.dataset.id }),
    });
    await loadInvoices();
  }));
}

function csvEscape(v) {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

document.getElementById('export-csv-btn').addEventListener('click', () => {
  if (!invoices.length) return;
  const headers = ['Leverantör', 'Fakturanummer', 'OCR', 'Fakturadatum', 'Förfallodatum', 'Belopp exkl moms', 'Moms', 'Totalbelopp'];
  const rows = invoices.map((inv) => [
    inv.leverantor, inv.fakturanummer, inv.ocr, inv.fakturadatum, inv.forfallodatum,
    inv.belopp_exkl_moms, inv.moms, inv.totalbelopp,
  ]);
  const csv = '﻿' + [headers, ...rows].map((r) => r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'fakturor.csv';
  a.click();
});

init();
</script>
</body>
</html>
