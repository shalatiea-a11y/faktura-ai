<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Skapa konto – Fakturaskanning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<style>
:root {
  --bg: #f3f6fb; --surface: #ffffff; --border: #e2e8f0;
  --ink: #0f172a; --ink-dim: #475569; --ink-faint: #94a3b8;
  --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #eff6ff;
  --error: #dc2626; --error-bg: #fef2f2;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(15,23,42,0.05), 0 8px 24px rgba(15,23,42,0.08);
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; font-family: var(--font); color: var(--ink);
  background: radial-gradient(circle at 80% 15%, #dbeafe 0%, var(--bg) 45%);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.card {
  width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 36px 32px;
}
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
.logo-mark {
  width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 15px; flex: none;
}
.logo-text { font-weight: 800; font-size: 16px; letter-spacing: -0.01em; }
h1 { font-size: 21px; margin: 0 0 6px; letter-spacing: -0.01em; }
.sub { color: var(--ink-dim); font-size: 14px; margin: 0 0 26px; }
label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-dim); margin: 16px 0 6px; }
label:first-of-type { margin-top: 0; }
input {
  width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: #fff; color: var(--ink); font-family: inherit; font-size: 14.5px;
}
input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.hint { font-size: 12px; color: var(--ink-faint); margin-top: 5px; }
.btn {
  width: 100%; margin-top: 22px; background: var(--primary); color: #fff; border: none;
  border-radius: 8px; padding: 12px 18px; font-weight: 700; font-size: 14.5px; cursor: pointer;
  font-family: inherit; transition: background 0.15s;
}
.btn:hover { background: var(--primary-dark); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.msg { font-size: 13px; margin-top: 14px; padding: 10px 12px; border-radius: 8px; display: none; }
.msg.error { display: block; background: var(--error-bg); color: var(--error); }
.foot { text-align: center; font-size: 13.5px; color: var(--ink-dim); margin-top: 22px; }
.foot a { color: var(--primary); font-weight: 600; text-decoration: none; }
.foot a:hover { text-decoration: underline; }
.back { display: inline-block; margin-bottom: 18px; font-size: 13px; color: var(--ink-faint); text-decoration: none; }
.back:hover { color: var(--ink-dim); }
</style>
</head>
<body>
<div class="card">
  <a class="back" href="/">← Till startsidan</a>
  <div class="logo"><div class="logo-mark">F</div><div class="logo-text">Fakturaskanning</div></div>
  <h1>Skapa konto</h1>
  <div class="sub">Ett konto per redovisningsbyrå. Gratis att komma igång.</div>

  <form id="signup-form">
    <label for="firm">Namn på byrå</label>
    <input type="text" id="firm" autocomplete="organization" required>
    <label for="email">E-post</label>
    <input type="email" id="email" autocomplete="email" required>
    <label for="password">Lösenord</label>
    <input type="password" id="password" autocomplete="new-password" minlength="8" required>
    <div class="hint">Minst 8 tecken.</div>
    <button class="btn" type="submit" id="submit-btn">Skapa konto</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="foot">Har ni redan ett konto? <a href="/login.html">Logga in</a></div>
</div>

<script>
if (localStorage.getItem('fa_token')) location.href = '/app.html';

const ERROR_MESSAGES = {
  email_taken: 'E-postadressen är redan registrerad. Prova att logga in istället.',
  invalid_email: 'Ogiltig e-postadress.',
  firm_name_required: 'Ange namnet på byrån.',
  password_too_short: 'Lösenordet måste vara minst 8 tecken.',
  auth_not_configured: 'Kontosystemet är inte klart konfigurerat än. Kontakta administratören.',
  store_not_configured: 'Databasen är inte kopplad. Kontakta administratören.',
};

document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  msg.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Skapar konto…';

  try {
    const res = await fetch('/api/auth/signup', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        firm_name: document.getElementById('firm').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'unknown');

    localStorage.setItem('fa_token', data.token);
    localStorage.setItem('fa_firm_name', data.firm_name || '');
    localStorage.setItem('fa_email', data.email || '');
    location.href = '/app.html';
  } catch (err) {
    msg.className = 'msg error';
    msg.textContent = ERROR_MESSAGES[err.message] || 'Något gick fel. Försök igen.';
    btn.disabled = false;
    btn.textContent = 'Skapa konto';
  }
});
</script>
</body>
</html>
